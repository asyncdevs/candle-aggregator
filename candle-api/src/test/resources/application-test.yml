# Test profile — used by @SpringBootTest and @WebMvcTest tests that do not use Testcontainers.
# Overrides the real datasource with H2 so no PostgreSQL or Docker instance is required.
# SQL init is disabled because schema.sql contains TimescaleDB-specific DDL (create_hypertable).
# Testcontainers-based tests override spring.datasource.url via @DynamicPropertySource instead.

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never

  kafka:
    consumer:
      group-id: test-candle-api-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.candle: WARN
    org.apache.kafka: ERROR
    org.springframework.kafka: ERROR
