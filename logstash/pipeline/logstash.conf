# ─────────────────────────────────────────────────────────────────────────────
# Logstash Pipeline — Candle Service
#
# Flow:
#   All Spring Boot services  →  TCP:5044 (JSON-lines)
#   Logstash filter           →  tag each document with its originating service
#   Elasticsearch output      →  per-service daily index
#                                  candle-logs-candle-api-2024.01.15
#                                  candle-logs-market-data-adapter-2024.01.15
#                                  candle-logs-logger-service-2024.01.15
#
# Kibana index pattern:  candle-logs-*
# ─────────────────────────────────────────────────────────────────────────────

input {
  tcp {
    port  => 5044
    codec => json_lines
  }
}

filter {
  # Resolve the target index from the "service" field injected by each
  # service's LogstashEncoder customFields config.
  if [service] {
    mutate {
      add_field => {
        "[@metadata][target_index]" => "candle-logs-%{service}"
      }
    }
  } else {
    mutate {
      add_field => {
        "[@metadata][target_index]" => "candle-logs-unknown"
      }
    }
  }

  # Normalise the @timestamp field.
  # LogstashEncoder writes @timestamp as an ISO-8601 string; parse it so
  # Elasticsearch stores it as a proper date type for Kibana time filtering.
  date {
    match   => ["@timestamp", "ISO8601"]
    target  => "@timestamp"
  }

  # Strip internal Logback fields that add noise in Kibana
  mutate {
    remove_field => ["port", "host", "tags"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # Daily index rotation keeps Kibana fast and simplifies retention policy.
    index => "%{[@metadata][target_index]}-%{+YYYY.MM.dd}"
  }
}
